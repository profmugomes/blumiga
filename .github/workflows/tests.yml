name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: openssl, mbstring, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: PHPUnit tests
        run: composer test
